<style>
:root{
  --bg:#f6efe4; --card:#fffcf6; --ink:#2b231d; --muted:#7b6d61; --line:#e7dac6;
  --red:#b02a20; --red-2:#8f1f17; --green:#1f4d33; --green-2:#163a26; --gold:#c8962b;
  --radius:16px; --shadow:0 1px 2px rgba(43,35,29,.06),0 6px 20px rgba(43,35,29,.07);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:84px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;line-height:1.2;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
.hidden{display:none!important}

/* Header */
header{background:var(--green);color:#fff;position:relative;overflow:hidden;padding:22px 20px 26px}
header::before{content:"";position:absolute;inset:0;opacity:.18;pointer-events:none;
  background-image:radial-gradient(#fff 1.2px,transparent 1.6px),radial-gradient(#fff 1px,transparent 1.4px);
  background-size:38px 38px,23px 23px;background-position:0 0,11px 17px}
.hwrap{max-width:640px;margin:0 auto;position:relative}
.kicker{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
header h1{font-size:28px;margin:4px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:4px 11px;font-size:14px}
.chip.gold{background:var(--gold);border-color:var(--gold);color:#2b1d05;font-weight:600}

main{max-width:640px;margin:0 auto;padding:16px}
.banner{max-width:640px;margin:12px auto 0;padding:0 16px}
.banner div{background:#fff4d6;border:1px solid #ecd28d;color:#5c4510;border-radius:12px;padding:10px 14px;font-size:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.card h2{font-size:21px;margin-bottom:6px}
.card h3{font-size:17px;margin-bottom:4px}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack>*+*{margin-top:10px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 10px}
.section-title h2{font-size:20px}

.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--red);color:#fff;transition:transform .05s,background .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:46px}
.btn:hover{background:var(--red-2)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:default}
.btn.green{background:var(--green)} .btn.green:hover{background:var(--green-2)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)} .btn.ghost:hover{background:#f1e7d8}
.btn.link{background:none;color:var(--red);padding:4px 2px;min-height:0;font-weight:600}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;min-height:36px;font-size:14px;border-radius:10px}

/* People */
.person{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.person summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.person summary::-webkit-details-marker{display:none}
.avatar{width:42px;height:42px;border-radius:50%;background:#f1e5d3;display:grid;place-items:center;font-size:22px;flex:none}
.person .name{font-weight:600}
.person .chev{margin-left:auto;color:var(--muted);transition:transform .2s}
.person[open] .chev{transform:rotate(90deg)}
.pbody{padding:0 14px 14px 68px;font-size:15px}
.field-l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:8px}
.pre{white-space:pre-wrap;word-wrap:break-word}
.tag{display:inline-block;font-size:12px;background:#e9f1ec;color:var(--green);border-radius:999px;padding:2px 8px;margin-left:6px;font-weight:600}

/* Reveal */
.reveal{width:100%;border:0;border-radius:20px;padding:34px 20px;background:linear-gradient(135deg,var(--red),#7d1912);color:#fff;cursor:pointer;box-shadow:var(--shadow);text-align:center}
.reveal .gift{font-size:64px;display:block;animation:wiggle 2.4s ease-in-out infinite}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-8deg)}90%{transform:rotate(8deg)}95%{transform:rotate(-4deg)}}
.match{text-align:center;padding:26px 18px;background:linear-gradient(180deg,#fff,#fbf3e6)}
.match.anim{animation:pop .45s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.match .avatar{width:84px;height:84px;font-size:44px;margin:8px auto 10px}
.match h2{font-size:30px}

/* Chat */
.chatlist{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.msg{max-width:85%;padding:9px 13px;border-radius:16px;background:var(--card);border:1px solid var(--line);align-self:flex-start;word-wrap:break-word}
.msg .txt{white-space:pre-wrap}
.msg.mine{align-self:flex-end;background:#e7f0ea;border-color:#cfe0d5}
.msg .who{font-size:12px;font-weight:600;margin-bottom:2px;display:flex;gap:8px;align-items:center}
.msg .time{font-size:11px;color:var(--muted);margin-top:2px}
.msg .del{border:0;background:none;color:var(--red);cursor:pointer;font-size:12px;padding:0;margin-left:auto}
.composer{position:sticky;bottom:76px;display:flex;gap:8px;background:var(--bg);padding:8px 0}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:14px;padding:11px 13px;background:#fff;min-height:46px;max-height:120px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fffcf6;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:640px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:9px 4px 10px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs button .ic{font-size:22px;line-height:1.1;filter:grayscale(.6);opacity:.75}
nav.tabs button.on{color:var(--red)}
nav.tabs button.on .ic{filter:none;opacity:1}
.dot{position:absolute;top:6px;left:calc(50% + 10px);background:var(--red);color:#fff;font-size:10px;border-radius:999px;padding:0 5px;min-width:16px;line-height:16px}

/* Forms & modal */
.modal{position:fixed;inset:0;background:rgba(30,22,16,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px 26px;animation:up .2s ease-out}
@media (min-width:640px){.modal{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-h h2{font-size:22px;flex:1}
.x{border:0;background:#efe4d4;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:18px}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
label.f>small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
input[type=text],input[type=password],input[type=date],input[type=tel],textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(31,77,51,.12)}
textarea{min-height:84px;resize:vertical}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis label{cursor:pointer}
.emojis input{position:absolute;opacity:0;pointer-events:none}
.emojis span{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:2px solid transparent;background:#f1e5d3;font-size:24px}
.emojis input:checked+span{border-color:var(--red);background:#fff}
.err{color:var(--red);font-size:14px;margin:4px 0 10px;min-height:1px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin:6px 0 14px}
.pmhead{font-size:14px;color:var(--muted);margin:-6px 0 12px}
.pmlist{max-height:52vh;overflow:auto;padding:4px 2px 8px;display:flex;flex-direction:column;gap:8px}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.loader{text-align:center;padding:60px 10px;color:var(--muted)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
ol.how{padding-left:20px;margin:8px 0 0} ol.how li{margin-bottom:4px}
.pill-list{display:flex;flex-direction:column;gap:6px}
.pill-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:#fff}
.pill-row .grow{flex:1;min-width:0}
</style>
</head>
<body>
<header><div class="hwrap" id="hdr"></div></header>
<div class="banner" id="banner"></div>
<main id="main"></main>
<nav class="tabs" id="tabs"></nav>

<script>
/* ==========================================================================
   CONFIGURAÇÃO — é só isto que precisa de alterar
   --------------------------------------------------------------------------
   1) FIREBASE: cole aqui o objeto "firebaseConfig" que o Firebase lhe dá
      (Definições do projeto > As suas apps > Web). Exemplo:
        FIREBASE: {
          apiKey: "AIza...",
          authDomain: "o-meu-projeto.firebaseapp.com",
          projectId: "o-meu-projeto",
          storageBucket: "o-meu-projeto.appspot.com",
          messagingSenderId: "123456789",
          appId: "1:123456789:web:abc123"
        },
      Se deixar null, a app funciona em "modo de demonstração" (os dados
      ficam só no seu dispositivo — serve para experimentar).
   2) GROUP: nome do grupo. Para fazer outro amigo secreto (ex.: para o ano,
      ou para outro grupo de amigos) com a mesma base de dados, basta mudar
      este nome. Use só letras, números e _
   ========================================================================== */
const CONFIG = {
  FIREBASE: {
  apiKey: "AIza...",
  authDomain: "o-seu-projeto.firebaseapp.com",
  projectId: "o-seu-projeto",
  storageBucket: "o-seu-projeto.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abc123"
},
  GROUP: "natal2026",
};
</script>

<script>
"use strict";
/* ---------------- Utilitários ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid = (n = 16) => [...crypto.getRandomValues(new Uint8Array(n))].map(b => b.toString(16).padStart(2, "0")).join("");
const KEY = k => `amigo_${CONFIG.GROUP}_${k}`;
const lsGet = k => { try { return JSON.parse(localStorage.getItem(KEY(k))); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(KEY(k)) : localStorage.setItem(KEY(k), JSON.stringify(v)); } catch (e) {} };
const EMOJIS = ["🎅","🤶","🦌","⛄","🎄","🎁","🍪","🌟","🔔","🧦","🐧","🦊","🐻","🦉","🍫","☕"];
const ALIASES = ["Rena Misteriosa","Duende Curioso","Pinguim Secreto","Boneco de Neve Tímido","Estrela Cadente","Biscoito de Gengibre","Sino Discreto","Meia Encantada","Floco de Neve","Coruja Noturna","Lareira Quentinha","Trenó Veloz","Bolota Mágica","Azevinho Calado","Pai Natal Disfarçado","Raposa do Norte"];
function toast(msg, ms = 2600) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), ms);
}
function fmtDate(d) {
  if (!d) return "";
  const dt = new Date(d + "T12:00:00");
  return isNaN(dt) ? d : dt.toLocaleDateString("pt-PT", { day: "numeric", month: "long", year: "numeric" });
}
function daysLeft(d) {
  if (!d) return null;
  const t = new Date(d + "T00:00:00"), n = new Date(); n.setHours(0,0,0,0);
  return Math.round((t - n) / 864e5);
}
function fmtTime(ts) {
  const d = new Date(ts), now = new Date();
  const hm = d.toLocaleTimeString("pt-PT", { hour: "2-digit", minute: "2-digit" });
  return d.toDateString() === now.toDateString() ? hm : d.toLocaleDateString("pt-PT", { day: "numeric", month: "short" }) + " " + hm;
}

/* ---------------- Criptografia (o sorteio fica secreto até para o organizador) ---------------- */
const te = new TextEncoder(), td = new TextDecoder();
const b64 = buf => { let s = ""; new Uint8Array(buf).forEach(b => s += String.fromCharCode(b)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const EC = { name: "ECDH", namedCurve: "P-256" };
async function pinKey(pin, salt) {
  const base = await crypto.subtle.importKey("raw", te.encode(pin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: unb64(salt), iterations: 150000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function hashPw(pw, salt) {
  const base = await crypto.subtle.importKey("raw", te.encode(pw), "PBKDF2", false, ["deriveBits"]);
  return b64(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: unb64(salt), iterations: 150000, hash: "SHA-256" }, base, 256));
}
async function aesEnc(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, te.encode(JSON.stringify(obj)));
  return { iv: b64(iv), ct: b64(ct) };
}
async function aesDec(key, box) {
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(box.iv) }, key, unb64(box.ct));
  return JSON.parse(td.decode(pt));
}
async function newKeyPair() {
  const kp = await crypto.subtle.generateKey(EC, true, ["deriveKey"]);
  return { pub: await crypto.subtle.exportKey("jwk", kp.publicKey), priv: await crypto.subtle.exportKey("jwk", kp.privateKey) };
}
async function sealFor(pubJwk, obj) {
  const eph = await crypto.subtle.generateKey(EC, true, ["deriveKey"]);
  const pub = await crypto.subtle.importKey("jwk", pubJwk, EC, false, []);
  const k = await crypto.subtle.deriveKey({ name: "ECDH", public: pub }, eph.privateKey, { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
  const box = await aesEnc(k, obj);
  box.epk = await crypto.subtle.exportKey("jwk", eph.publicKey);
  return box;
}
async function openSealed(privJwk, box) {
  const priv = await crypto.subtle.importKey("jwk", privJwk, EC, false, ["deriveKey"]);
  const epk = await crypto.subtle.importKey("jwk", box.epk, EC, false, []);
  const k = await crypto.subtle.deriveKey({ name: "ECDH", public: epk }, priv, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return aesDec(k, box);
}

/* ---------------- Base de dados: Firebase, Claude ou demonstração local ---------------- */
function loadScript(src) {
  return new Promise((ok, ko) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s); });
}
async function pickBackend() {
  for (let i = 0; i < 10 && !(window.claude && typeof window.claude.use === "function"); i++) await sleep(100);
  if (window.claude && typeof window.claude.use === "function") {
    try {
      const db = await Promise.race([window.claude.use("db"), sleep(10000).then(() => null)]);
      if (db) { S.mode = "claude"; return db; }
    } catch (e) {}
  }
  if (CONFIG.FIREBASE) {
    try {
      const v = "10.12.2";
      await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);
      await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore-compat.js`);
      firebase.initializeApp(CONFIG.FIREBASE);
      S.mode = "firebase";
      return firebase.firestore();
    } catch (e) {
      console.error(e);
      S.warn = "Não foi possível ligar ao Firebase. Confirme a configuração. Por agora, a app está em modo de demonstração.";
    }
  }
  S.mode = "local";
  return makeLocalDb();
}
function makeLocalDb() {
  const SK = "amigo_demo_db";
  let store = {};
  const load = () => { try { store = JSON.parse(localStorage.getItem(SK) || "{}") || {}; } catch (e) {} };
  load();
  const subs = new Set();
  window.addEventListener("storage", e => { if (e.key === SK) { load(); fire(); } });
  const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
  const fire = () => subs.forEach(f => { try { f(); } catch (e) { console.error(e); } });
  const commit = () => { try { localStorage.setItem(SK, JSON.stringify(store)); } catch (e) {} setTimeout(fire, 0); };
  const meta = { fromCache: false, hasPendingWrites: false };
  const snapDoc = (col, id) => { const v = store[col] && store[col][id]; return { id, exists: !!v, data: () => v ? clone(v) : undefined, metadata: meta }; };
  function query(col, f = [], ob = null, lim = null) {
    const run = () => {
      let docs = Object.keys(store[col] || {}).map(id => snapDoc(col, id));
      docs = docs.filter(d => f.every(([k, op, v]) => op === "==" ? d.data()[k] === v : true));
      if (ob) { const [k, dir] = ob; docs.sort((a, b) => { const x = a.data()[k], y = b.data()[k]; return (x > y ? 1 : x < y ? -1 : 0) * (dir === "desc" ? -1 : 1); }); }
      if (lim) docs = docs.slice(0, lim);
      return { docs, size: docs.length, empty: !docs.length, metadata: meta };
    };
    return {
      where: (k, op, v) => query(col, [...f, [k, op, v]], ob, lim),
      orderBy: (k, dir = "asc") => query(col, f, [k, dir], lim),
      limit: n => query(col, f, ob, n),
      get: async () => run(),
      onSnapshot(next) { const fn = () => next(run()); subs.add(fn); setTimeout(fn, 0); return () => subs.delete(fn); }
    };
  }
  function docRef(col, id) {
    return {
      id,
      get: async () => snapDoc(col, id),
      async set(v) { (store[col] = store[col] || {})[id] = clone(v); commit(); },
      async update(v) { if (!store[col] || !store[col][id]) throw new Error("not found"); Object.assign(store[col][id], clone(v)); commit(); },
      async delete() { if (store[col]) delete store[col][id]; commit(); },
      onSnapshot(next) { const fn = () => next(snapDoc(col, id)); subs.add(fn); setTimeout(fn, 0); return () => subs.delete(fn); }
    };
  }
  return {
    collection(col) {
      return Object.assign({}, query(col), {
        doc: id => docRef(col, id || rid()),
        async add(v) { const r = docRef(col, rid()); await r.set(v); return r; }
      });
    }
  };
}
const C = name => S.db.collection(`${CONFIG.GROUP}_${name}`);

/* ---------------- Estado ---------------- */
const S = {
  mode: null, db: null, warn: null, err: null,
  cfg: null, people: [], chat: [], pm: {},
  loaded: { cfg: false, people: false },
  me: null, match: null, sealedSig: undefined, revealed: false,
  admin: false, tab: "people", openThread: null, pmUnsubs: [],
  alias: null
};

/* ---------------- Arranque ---------------- */
async function init() {
  S.tab = ["people","secret","chat","admin"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "people";
  S.alias = lsGet("alias") || newAlias();
  render();
  try { S.db = await pickBackend(); }
  catch (e) { S.mode = "local"; S.db = makeLocalDb(); }
  subscribe();
  render();
}
function newAlias() {
  const a = { name: ALIASES[Math.floor(Math.random() * ALIASES.length)] + " " + (10 + Math.floor(Math.random() * 90)), hue: Math.floor(Math.random() * 360) };
  lsSet("alias", a); return a;
}
function onDbErr(e) {
  console.error(e);
  if (e && (e.code === "quota_exceeded" || e.code === "resource-exhausted")) S.err = "A base de dados atingiu o limite. Tente mais tarde.";
  else if (!S.loaded.cfg) S.err = "Não foi possível ligar à base de dados.";
  render();
}
function subscribe() {
  const timer = setTimeout(() => { if (!S.loaded.cfg) { S.err = "A ligação está a demorar. Verifique a internet e a configuração."; render(); } }, 10000);
  C("config").doc("main").onSnapshot(d => {
    clearTimeout(timer);
    S.cfg = d.exists ? d.data() : null; S.loaded.cfg = true; S.err = null;
    const adm = lsGet("admin");
    S.admin = !!(S.cfg && adm && adm === S.cfg.adminHash);
    render();
  }, onDbErr);
  C("people").onSnapshot(snap => {
    S.people = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    S.loaded.people = true;
    const fromCache = snap.metadata && snap.metadata.fromCache;
    if (!S.me) { const s = lsGet("session"); if (s && s.id && s.priv) S.me = s; }
    if (S.me && !S.people.some(p => p.id === S.me.id)) { if (!fromCache) logout(true); }
    else refreshMatch();
    render();
  }, onDbErr);
  C("chat").orderBy("ts", "desc").limit(300).onSnapshot(snap => {
    S.chat = snap.docs.map(d => ({ id: d.id, ...d.data() })).reverse();
    if (S.tab === "chat" && $("#chatList")) renderChatList(); else renderTabs();
  }, onDbErr);
}
async function refreshMatch() {
  const me = S.me && S.people.find(p => p.id === S.me.id);
  if (!me) return;
  const sig = me.sealed ? me.sealed.ct : null;
  if (sig === S.sealedSig) return;
  S.sealedSig = sig;
  unsubPm();
  if (!sig) { S.match = null; S.revealed = false; render(); return; }
  try { S.match = await openSealed(S.me.priv, me.sealed); }
  catch (e) { console.error(e); S.match = { error: true }; }
  S.revealed = !!lsGet("revealed_" + sig);
  if (S.match && !S.match.error) subPm();
  render();
}
function subPm() {
  [["give", "santa"], ["get", "friend"]].forEach(([k]) => {
    const tid = S.match[k];
    if (!tid) return;
    const u = C("pm").where("t", "==", tid).onSnapshot(snap => {
      S.pm[tid] = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.ts - b.ts);
      if (S.openThread && S.openThread.tid === tid) renderPmList();
      if (S.tab === "secret") renderMain(); else renderTabs();
    }, onDbErr);
    S.pmUnsubs.push(u);
  });
}
function unsubPm() { S.pmUnsubs.forEach(u => { try { u(); } catch (e) {} }); S.pmUnsubs = []; S.pm = {}; }
function logout(silent) {
  S.me = null; S.match = null; S.sealedSig = undefined; S.revealed = false;
  unsubPm(); lsSet("session", null);
  if (!silent) toast("Saiu da sua conta.");
  render();
}
const meP = () => S.me && S.people.find(p => p.id === S.me.id);
const drawn = () => !!(S.cfg && S.cfg.drawn);
function unreadCount(tid) {
  const seen = lsGet("seen_" + (S.me ? S.me.id : "") + "_" + tid) || 0;
  const role = S.match && S.match.give === tid ? "santa" : "friend";
  return (S.pm[tid] || []).filter(m => m.ts > seen && m.s !== role).length;
}

/* ---------------- Render ---------------- */
function render() { renderHeader(); renderBanner(); renderTabs(); renderMain(); }

function renderHeader() {
  const c = S.cfg;
  const dl = c ? daysLeft(c.date) : null;
  let chips = "";
  if (c) {
    if (c.date) chips += `<span class="chip">📅 ${esc(fmtDate(c.date))}</span>`;
    if (c.budget) chips += `<span class="chip">💶 ${esc(c.budget)}</span>`;
    if (c.place) chips += `<span class="chip">📍 ${esc(c.place)}</span>`;
    if (dl != null && dl > 0) chips += `<span class="chip gold">Faltam ${dl} ${dl === 1 ? "dia" : "dias"}</span>`;
    if (dl === 0) chips += `<span class="chip gold">É hoje! 🎉</span>`;
  }
  $("#hdr").innerHTML = `<div class="kicker">🎁 Amigo secreto</div><h1>${esc(c ? c.title : "Amigo Secreto de Natal")}</h1><div class="chips">${chips}</div>`;
  document.title = c ? c.title : "Amigo Secreto de Natal";
}
function renderBanner() {
  let msg = "";
  if (S.warn) msg = S.warn;
  else if (S.mode === "local") msg = "Modo de demonstração: os dados ficam só neste dispositivo. Para todos usarem, configure o Firebase (ver instruções).";
  $("#banner").innerHTML = msg ? `<div>${esc(msg)}</div>` : "";
}
function renderTabs() {
  const pmUnread = S.match && !S.match.error ? unreadCount(S.match.give) + unreadCount(S.match.get) : 0;
  const lastChat = S.chat.length ? S.chat[S.chat.length - 1].ts : 0;
  const chatNew = S.tab !== "chat" && lastChat > (lsGet("chatSeen") || 0);
  const tabs = [
    ["people", "🎄", "Grupo", ""],
    ["secret", "🎁", "O meu sorteio", pmUnread ? `<span class="dot">${pmUnread}</span>` : ""],
    ["chat", "💬", "Chat anónimo", chatNew ? `<span class="dot">•</span>` : ""],
    ["admin", "⭐", "Organizador", ""]
  ];
  $("#tabs").innerHTML = `<div class="in">${tabs.map(([k, ic, l, b]) => `<button data-tab="${k}" class="${S.tab === k ? "on" : ""}"><span class="ic">${ic}</span>${l}${b}</button>`).join("")}</div>`;
  $$("#tabs button").forEach(b => b.onclick = () => go(b.dataset.tab));
}
function go(tab) {
  S.tab = tab;
  try { history.replaceState(null, "", "#" + tab); } catch (e) {}
  $("#main").innerHTML = "";
  window.scrollTo(0, 0);
  render();
}
function renderMain() {
  const m = $("#main");
  if (S.err && !S.loaded.cfg) { m.innerHTML = `<div class="card"><h2>Ups…</h2><p>${esc(S.err)}</p></div>`; return; }
  if (!S.loaded.cfg || !S.db) { m.innerHTML = `<div class="loader"><div class="spin"></div>A carregar…</div>`; return; }
  if (!S.cfg) { m.innerHTML = viewSetup(); bindSetup(); return; }
  if (S.tab === "chat") {
    if (!$("#chatList")) { m.innerHTML = viewChat(); bindChat(); }
    renderChatList(); return;
  }
  if (S.tab === "secret") { m.innerHTML = viewSecret(); bindSecret(); return; }
  if (S.tab === "admin") { m.innerHTML = viewAdmin(); bindAdmin(); return; }
  m.innerHTML = viewPeople(); bindPeople();
}

      window.scrollTo(0, document.body.scrollHeight);
    } catch (err) { console.error(err); ta.value = text; toast("Não foi possível enviar. Tente de novo."); }
  };
}

/* ---------------- Sorteio ---------------- */
function makePairs(ids, exclusions) {
  const bad = new Set();
  exclusions.forEach(s => { const [a, b] = s.split("|"); bad.add(a + "|" + b); bad.add(b + "|" + a); });
  for (let t = 0; t < 20000; t++) {
    const p = ids.slice();
    for (let i = p.length - 1; i > 0; i--) { const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1); [p[i], p[j]] = [p[j], p[i]]; }
    let ok = true;
    for (let i = 0; i < p.length && ok; i++) if (bad.has(p[i] + "|" + p[(i + 1) % p.length])) ok = false;
    if (ok) { const m = {}; p.forEach((g, i) => m[g] = p[(i + 1) % p.length]); return m; }
  }
  return null;
}
async function doDraw(redo) {
  const people = S.people.slice();
  if (people.length < 3) return toast("São precisas pelo menos 3 pessoas.");
  if (!await confirmBox(redo ? "Refazer o sorteio? Todos vão receber uma nova pessoa e as mensagens secretas anteriores são apagadas." : `Fazer o sorteio com ${people.length} pessoas? Depois disso, as inscrições fecham.`)) return;
  const pairs = makePairs(people.map(p => p.id), S.cfg.exclusions || []);
  if (!pairs) return toast("Com estas exclusões não é possível fazer o sorteio. Retire alguma.", 4000);
  toast("A sortear…", 10000);
  try {
    if (redo) await clearPm();
    const thread = {}; people.forEach(p => thread[p.id] = rid(12));
    const santaOf = {}; Object.entries(pairs).forEach(([g, r]) => santaOf[r] = g);
    for (const p of people) {
      const sealed = await sealFor(p.pub, { to: pairs[p.id], give: thread[p.id], get: thread[santaOf[p.id]] });
      await C("people").doc(p.id).update({ sealed });
    }
    await C("config").doc("main").update({ drawn: true, drawnAt: Date.now() });
    toast("Sorteio feito! 🎉 Cada pessoa já pode ver a quem vai oferecer.", 4000);
  } catch (e) { console.error(e); toast("Ocorreu um erro no sorteio. Tente outra vez.", 4000); }
}
async function undoDraw() {
  if (!await confirmBox("Anular o sorteio? As inscrições voltam a abrir e as mensagens secretas são apagadas.")) return;
  for (const p of S.people) if (p.sealed) await C("people").doc(p.id).update({ sealed: null });
  await clearPm();
  await C("config").doc("main").update({ drawn: false, drawnAt: null });
  toast("Sorteio anulado.");
}
async function clearPm() {
  const snap = await C("pm").get();
  for (const d of snap.docs) await C("pm").doc(d.id).delete();
}

/* ---------------- Janelas (formulários) ---------------- */
function openModal(title, body, onMount) {
  const m = $("#modal");
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-h"><h2>${esc(title)}</h2><button class="x" aria-label="Fechar">✕</button></div>${body}</div>`;
  m.classList.remove("hidden");
  document.body.style.overflow = "hidden";
  $(".x", m).onclick = closeModal;
  m.onclick = e => { if (e.target === m) closeModal(); };
  onMount && onMount(m);
  const first = $("input:not([type=radio]):not([type=checkbox]),textarea,select", m);
  if (first && !matchMedia("(pointer:coarse)").matches) first.focus();
}
function closeModal() {
  const m = $("#modal"); m.classList.add("hidden"); m.innerHTML = "";
  document.body.style.overflow = "";
  if (S.openThread) { S.openThread = null; renderMain(); renderTabs(); }
}
function confirmBox(text, okLabel = "Confirmar") {
  return new Promise(res => {
    openModal("Confirmar", `<p>${esc(text)}</p><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn ghost" id="cNo">Cancelar</button><button class="btn" id="cYes">${esc(okLabel)}</button></div>`, m => {
      $("#cNo", m).onclick = () => { closeModal(); res(false); };
      $("#cYes", m).onclick = () => { closeModal(); res(true); };
      $(".x", m).onclick = () => { closeModal(); res(false); };
    });
  });
}
const val = (m, id) => ($("#" + id, m).value || "").trim();
function setBusy(btn, busy, label) { btn.disabled = busy; if (label) btn.textContent = label; }

function profileFields(p = {}) {
  const em = p.emoji || EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
  return `
    <label class="f"><span>Nome *</span><input type="text" id="fName" maxlength="40" value="${esc(p.name)}" placeholder="Como o grupo o conhece" autocomplete="name"></label>
    <div class="f" style="margin-bottom:12px"><span style="display:block;font-weight:600;font-size:14px;margin-bottom:5px">Avatar</span>
      <div class="emojis">${EMOJIS.map(e => `<label><input type="radio" name="emoji" value="${e}" ${e === em ? "checked" : ""}><span>${e}</span></label>`).join("")}</div></div>
    <label class="f"><span>Lista de desejos *</span><textarea id="fWishes" maxlength="800" placeholder="Ex.: um livro de culinária, meias quentinhas, uma caneca gira…">${esc(p.wishes)}</textarea><small>Dê várias ideias, para facilitar a vida a quem lhe vai oferecer.</small></label>
    <label class="f"><span>Gosta de</span><textarea id="fLikes" maxlength="400" placeholder="Cores, hobbies, séries, autores…">${esc(p.likes)}</textarea></label>
    <label class="f"><span>Não gosta / evitar</span><textarea id="fDislikes" maxlength="400" placeholder="Ex.: chocolate preto, perfumes…">${esc(p.dislikes)}</textarea></label>
    <label class="f"><span>Tamanhos</span><input type="text" id="fSizes" maxlength="120" value="${esc(p.sizes)}" placeholder="Ex.: camisola M, sapatos 39"></label>
    <label class="f"><span>Contacto (opcional)</span><input type="text" id="fContact" maxlength="80" value="${esc(p.contact)}" placeholder="Telemóvel ou e-mail"><small>Fica visível para todo o grupo.</small></label>`;
}
function readProfile(m) {
  return {
    name: val(m, "fName").slice(0, 40),
    emoji: ($("input[name=emoji]:checked", m) || {}).value || "🎁",
    wishes: val(m, "fWishes").slice(0, 800),
    likes: val(m, "fLikes").slice(0, 400),
    dislikes: val(m, "fDislikes").slice(0, 400),
    sizes: val(m, "fSizes").slice(0, 120),
    contact: val(m, "fContact").slice(0, 80)
  };
}
function checkProfile(p, selfId) {
  if (!p.name) return "Escreva o seu nome.";
  if (!p.wishes) return "Escreva pelo menos uma ideia na lista de desejos.";
  const norm = s => s.toLocaleLowerCase("pt-PT").normalize("NFD").replace(/\p{Diacritic}/gu, "").trim();
  if (S.people.some(x => x.id !== selfId && norm(x.name) === norm(p.name))) return "Já existe alguém com esse nome. Acrescente o apelido, por exemplo.";
  return "";
}

function openRegister() {
  if (drawn()) return toast("O sorteio já foi feito: as inscrições estão fechadas.");
  openModal("Inscrever-me", `
    ${profileFields()}
    <label class="f"><span>PIN *</span><input type="password" id="fPin" inputmode="numeric" maxlength="20" placeholder="Pelo menos 4 caracteres" autocomplete="new-password"><small>Vai precisar dele para ver o seu sorteio. Não há forma de o recuperar depois do sorteio, por isso guarde-o.</small></label>
    <label class="f"><span>Repetir PIN *</span><input type="password" id="fPin2" inputmode="numeric" maxlength="20" autocomplete="new-password"></label>
    <label class="check"><input type="checkbox" id="fRemember" checked> Manter sessão iniciada neste dispositivo</label>
    <div class="err" id="fErr"></div>
    <button class="btn block" id="fGo">Inscrever-me 🎁</button>`, m => {
    $("#fGo", m).onclick = async () => {
      const p = readProfile(m), pin = val(m, "fPin"), pin2 = val(m, "fPin2"), err = $("#fErr", m);
      const e = checkProfile(p) || (pin.length < 4 ? "O PIN tem de ter pelo menos 4 caracteres." : pin !== pin2 ? "Os PIN não coincidem." : "");
      if (e) { err.textContent = e; return; }
      if (drawn()) { err.textContent = "O sorteio acabou de ser feito: as inscrições fecharam."; return; }
      const btn = $("#fGo", m); setBusy(btn, true, "A inscrever…");
      try {
        const id = rid(10), salt = b64(crypto.getRandomValues(new Uint8Array(16)));
        const kp = await newKeyPair();
        const encPriv = await aesEnc(await pinKey(pin, salt), kp.priv);
        await C("people").doc(id).set({ ...p, salt, pub: kp.pub, encPriv, sealed: null, createdAt: Date.now() });
        S.me = { id, priv: kp.priv }; S.sealedSig = undefined;
        if ($("#fRemember", m).checked) lsSet("session", S.me);
        closeModal(); toast(`Bem-vindo, ${p.name}! 🎄`);
        go("secret");
      } catch (ex) { console.error(ex); err.textContent = "Não foi possível guardar. Tente outra vez."; setBusy(btn, false, "Inscrever-me 🎁"); }
    };
  });
}
function openLogin() {
  if (!S.people.length) return toast("Ainda não há ninguém inscrito.");
  openModal("Entrar", `
    <label class="f"><span>Quem é você?</span><select id="lWho"><option value="">Escolha o seu nome…</option>${S.people.map(p => `<option value="${esc(p.id)}">${esc(p.emoji || "")} ${esc(p.name)}</option>`).join("")}</select></label>
    <label class="f"><span>PIN</span><input type="password" id="lPin" inputmode="numeric" maxlength="20" autocomplete="current-password"></label>
    <label class="check"><input type="checkbox" id="lRemember" checked> Manter sessão iniciada neste dispositivo</label>
    <div class="err" id="lErr"></div>
    <button class="btn block" id="lGo">Entrar</button>`, m => {
    const go2 = async () => {
      const id = val(m, "lWho"), pin = val(m, "lPin"), err = $("#lErr", m);
      if (!id) { err.textContent = "Escolha o seu nome."; return; }
      const p = S.people.find(x => x.id === id);
      const btn = $("#lGo", m); setBusy(btn, true, "A verificar…");
      try {
        const priv = await aesDec(await pinKey(pin, p.salt), p.encPriv);
        S.me = { id, priv }; S.sealedSig = undefined;
        if ($("#lRemember", m).checked) lsSet("session", S.me);
        closeModal(); toast(`Olá, ${p.name}!`);
        refreshMatch(); go("secret");
      } catch (e) { err.textContent = "PIN incorreto."; setBusy(btn, false, "Entrar"); }
    };
    $("#lGo", m).onclick = go2;
    $("#lPin", m).onkeydown = e => { if (e.key === "Enter") go2(); };
  });
}
function openEdit() {
  const me = meP(); if (!me) return;
  openModal("Os meus dados", `
    ${profileFields(me)}
    <details style="margin-bottom:12px"><summary style="cursor:pointer;font-weight:600;font-size:14px">Mudar o PIN</summary>
      <label class="f" style="margin-top:10px"><span>Novo PIN</span><input type="password" id="fPin" inputmode="numeric" maxlength="20" autocomplete="new-password"></label>
      <label class="f"><span>Repetir novo PIN</span><input type="password" id="fPin2" inputmode="numeric" maxlength="20" autocomplete="new-password"></label>
    </details>
    <div class="err" id="fErr"></div>
    <button class="btn block" id="fGo">Guardar</button>`, m => {
    $("#fGo", m).onclick = async () => {
      const p = readProfile(m), pin = val(m, "fPin"), pin2 = val(m, "fPin2"), err = $("#fErr", m);
      const e = checkProfile(p, me.id) || (pin && pin.length < 4 ? "O PIN tem de ter pelo menos 4 caracteres." : pin !== pin2 ? "Os PIN não coincidem." : "");
      if (e) { err.textContent = e; return; }
      const btn = $("#fGo", m); setBusy(btn, true, "A guardar…");
      try {
        const upd = { ...p };
        if (pin) { upd.salt = b64(crypto.getRandomValues(new Uint8Array(16))); upd.encPriv = await aesEnc(await pinKey(pin, upd.salt), S.me.priv); }
        await C("people").doc(me.id).update(upd);
        closeModal(); toast("Dados guardados.");
      } catch (ex) { console.error(ex); err.textContent = "Não foi possível guardar. Tente outra vez."; setBusy(btn, false, "Guardar"); }
    };
  });
}
function openEventForm(isNew) {
  const c = S.cfg || {};
  openModal(isNew ? "Criar amigo secreto" : "Editar evento", `
    <label class="f"><span>Nome *</span><input type="text" id="eTitle" maxlength="60" value="${esc(c.title || "Amigo Secreto de Natal " + new Date().getFullYear())}"></label>
    <label class="f"><span>Data da troca de prendas</span><input type="date" id="eDate" value="${esc(c.date || "")}"></label>
    <label class="f"><span>Valor da prenda</span><input type="text" id="eBudget" maxlength="40" value="${esc(c.budget || "")}" placeholder="Ex.: até 20 €"></label>
    <label class="f"><span>Local</span><input type="text" id="ePlace" maxlength="60" value="${esc(c.place || "")}" placeholder="Ex.: Jantar em casa da Ana"></label>
    <label class="f"><span>Mensagem para o grupo</span><textarea id="eNotes" maxlength="600" placeholder="Regras, horário, dress code…">${esc(c.notes || "")}</textarea></label>
    ${isNew ? `<label class="f"><span>Palavra-passe de organizador *</span><input type="password" id="ePw" maxlength="40" autocomplete="new-password"><small>Serve para fazer o sorteio e gerir o grupo. Mínimo 6 caracteres.</small></label>
    <label class="f"><span>Repetir palavra-passe *</span><input type="password" id="ePw2" maxlength="40" autocomplete="new-password"></label>` : ""}
    <div class="err" id="eErr"></div>
    <button class="btn block" id="eGo">${isNew ? "Criar" : "Guardar"}</button>`, m => {
    $("#eGo", m).onclick = async () => {
      const err = $("#eErr", m);
      const d = { title: val(m, "eTitle"), date: val(m, "eDate"), budget: val(m, "eBudget"), place: val(m, "ePlace"), notes: val(m, "eNotes") };
      if (!d.title) { err.textContent = "Dê um nome ao amigo secreto."; return; }
      const btn = $("#eGo", m); setBusy(btn, true, "A guardar…");
      try {
        if (isNew) {
          const pw = val(m, "ePw"), pw2 = val(m, "ePw2");
          if (pw.length < 6) { err.textContent = "A palavra-passe tem de ter pelo menos 6 caracteres."; setBusy(btn, false, "Criar"); return; }
          if (pw !== pw2) { err.textContent = "As palavras-passe não coincidem."; setBusy(btn, false, "Criar"); return; }
          const existing = await C("config").doc("main").get();
          if (existing.exists) { err.textContent = "Alguém acabou de criar este amigo secreto."; setBusy(btn, false, "Criar"); return; }
          const adminSalt = b64(crypto.getRandomValues(new Uint8Array(16)));
          const adminHash = await hashPw(pw, adminSalt);
          await C("config").doc("main").set({ ...d, adminSalt, adminHash, drawn: false, drawnAt: null, exclusions: [], createdAt: Date.now() });
          lsSet("admin", adminHash); S.admin = true;
          closeModal(); toast("Amigo secreto criado! Agora partilhe o link com o grupo. 🎄", 4000);
        } else {
          await C("config").doc("main").update(d);
          closeModal(); toast("Evento atualizado.");
        }
      } catch (ex) { console.error(ex); err.textContent = "Não foi possível guardar. Tente outra vez."; setBusy(btn, false, isNew ? "Criar" : "Guardar"); }
    };
  });
}
function openAdminLogin() {
  openModal("Organizador", `
    <label class="f"><span>Palavra-passe de organizador</span><input type="password" id="aPw" maxlength="40" autocomplete="current-password"></label>
    <div class="err" id="aErr"></div>
    <button class="btn block" id="aGo">Entrar</button>`, m => {
    const go2 = async () => {
      const btn = $("#aGo", m); setBusy(btn, true, "A verificar…");
      const h = await hashPw(val(m, "aPw"), S.cfg.adminSalt);
      if (h === S.cfg.adminHash) { lsSet("admin", h); S.admin = true; closeModal(); render(); toast("Modo organizador ativo."); }
      else { $("#aErr", m).textContent = "Palavra-passe incorreta."; setBusy(btn, false, "Entrar"); }
    };
    $("#aGo", m).onclick = go2;
    $("#aPw", m).onkeydown = e => { if (e.key === "Enter") go2(); };
  });
}
function openExclusion() {
  const opts = `<option value="">Escolha…</option>` + S.people.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
  openModal("Nova exclusão", `
    <p class="muted small" style="margin-top:0">Estas duas pessoas não se vão tirar uma à outra.</p>
    <label class="f"><span>Pessoa 1</span><select id="x1">${opts}</select></label>
    <label class="f"><span>Pessoa 2</span><select id="x2">${opts}</select></label>
    <div class="err" id="xErr"></div>
    <button class="btn block" id="xGo">Adicionar</button>`, m => {
    $("#xGo", m).onclick = async () => {
      const a = val(m, "x1"), b = val(m, "x2");
      if (!a || !b || a === b) { $("#xErr", m).textContent = "Escolha duas pessoas diferentes."; return; }
      const ex = (S.cfg.exclusions || []).filter(s => s !== a + "|" + b && s !== b + "|" + a);
      ex.push(a + "|" + b);
      await C("config").doc("main").update({ exclusions: ex });
      closeModal(); toast("Exclusão adicionada.");
    };
  });
}

/* ----- Conversa secreta ----- */
function openPm(tid, role, title, sub) {
  S.openThread = { tid, role };
  openModal(title, `<div class="pmhead">${esc(sub)}</div><div class="pmlist" id="pmList"></div>
    <form class="composer" id="pmForm" style="position:static;padding-bottom:0"><textarea id="pmText" rows="1" maxlength="500" placeholder="Escreva uma mensagem…"></textarea><button class="btn" type="submit" aria-label="Enviar">➤</button></form>`, m => {
    renderPmList();
    const ta = $("#pmText", m);
    ta.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer:coarse)").matches) { e.preventDefault(); $("#pmForm", m).requestSubmit(); } };
    $("#pmForm", m).onsubmit = async e => {
      e.preventDefault();
      const text = ta.value.trim(); if (!text) return;
      ta.value = "";
      try { await C("pm").doc(rid(10)).set({ t: tid, s: role, text: text.slice(0, 500), ts: Date.now() }); }
      catch (err) { console.error(err); ta.value = text; toast("Não foi possível enviar."); }
    };
  });
}
function renderPmList() {
  const el = $("#pmList"); if (!el || !S.openThread) return;
  const { tid, role } = S.openThread;
  const msgs = S.pm[tid] || [];
  const other = role === "santa" ? ((S.people.find(p => p.id === S.match.to) || {}).name || "Pessoa") : "🎅 Amigo secreto";
  el.innerHTML = msgs.length ? msgs.map(m => `<div class="msg ${m.s === role ? "mine" : ""}"><div class="who">${m.s === role ? "Você" : esc(other)}</div><div class="txt">${esc(m.text)}</div><div class="time">${fmtTime(m.ts)}</div></div>`).join("")
    : `<div class="empty">Ainda não há mensagens.</div>`;
  el.scrollTop = el.scrollHeight;
  if (msgs.length) lsSet("seen_" + (S.me ? S.me.id : "") + "_" + tid, msgs[msgs.length - 1].ts);
}

window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (["people","secret","chat","admin"].includes(t) && t !== S.tab) go(t); });
init();
